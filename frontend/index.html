  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --page: #f6f5f1;
      --surface: #fff;
      --ink: #23251f;
      --muted: #777970;
      --line: #e7e6df;
      --accent: #356653;
      --shadow: 0 12px 30px rgb(42 45 35 / 14%);
      --selected: #eaf1ec;
      --selected-ink: #254d3e;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #171b18;
      --surface: #222923;
      --ink: #edf1eb;
      --muted: #a5afa5;
      --line: #3a443b;
      --accent: #9dceab;
      --shadow: 0 12px 30px rgb(0 0 0 / 35%);
      --selected: #2e4033;
      --selected-ink: #bee4c7;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { background: var(--page); color: var(--ink); }
    button, a { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .navigation {
      position: fixed;
      z-index: 100;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
    }
    .menu-button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }
    .menu-button:hover, .helper-link:hover { border-color: var(--accent); }
    .menu-icon { display: grid; gap: 4px; }
    .menu-icon span { width: 18px; height: 2px; border-radius: 2px; background: currentColor; }
    .menu {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: min(560px, calc(100vw - 24px));
      max-height: calc(100vh - 68px);
      max-height: calc(100dvh - 68px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .menu[hidden] { display: none; }
    @media (prefers-reduced-motion: no-preference) {
      .menu:not([hidden]) { animation: menu-arrive 180ms cubic-bezier(.16, 1, .3, 1) both; transform-origin: top left; }
      @keyframes menu-arrive {
        from { opacity: 0; translate: 0 -6px; scale: .985; }
        to { opacity: 1; translate: 0 0; scale: 1; }
      }
    }
    .menu-group { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .menu-group + .menu-group { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }
    .menu-group h2 { grid-column: 1 / -1; }
    .menu-group h2 { margin: 8px 12px 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .helper-link {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      grid-template-rows: auto auto;
      align-content: center;
      column-gap: 8px;
      text-align: left;
      width: 100%;
      padding: 6px 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      text-decoration: none;
    }
    .helper-link[aria-current="page"] { background: var(--selected); color: var(--selected-ink); }
    .helper-name { display: block; font-size: 14px; font-weight: 700; }
    :is(.helper-link, .dashboard-link) > .helper-icon { grid-column: 1; grid-row: 1 / 3; align-self: center; }
    :is(.helper-link, .dashboard-link) > :is(.helper-name, .helper-description) { grid-column: 2; min-width: 0; overflow-wrap: anywhere; }
    .helper-description { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .helper-icon {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--page);
      font: 18px/1 "Sawarabi Mincho", serif;
      vertical-align: middle;
    }
    .helper-icon:has(> img) { background: none; border-radius: 0; }
    .helper-icon > img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .dashboard-link .helper-icon { width: 30px; height: 30px; }
    @media (max-width: 600px) {
      .navigation { left: auto; right: 12px; transform: none; }
      .menu { left: auto; right: 0; transform: none; }
    }
    .helper-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    .dashboard { max-width: 1080px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .site-header { max-width: 1032px; margin-inline: auto !important; width: calc(100% - 48px); }
    .dashboard-intro, .dashboard .menu-group h2 { grid-column: 1 / -1; }
    .dashboard-intro { display: flex; align-items: center; gap: 18px; margin-bottom: 6px; }
    .dashboard-logo { flex: none; width: 76px; height: 76px; object-fit: contain; }
    .dashboard h1 { margin: 0 0 8px; font-size: 30px; }
    .dashboard-intro p { color: var(--muted); margin: 0; }
    .dashboard .menu-group { display: contents; }
    .dashboard .menu-group h2 { margin: 16px 0 2px; font-size: 13px; }
    .dashboard-link { display: grid; grid-template-columns: 32px minmax(0, 1fr); column-gap: 8px; min-height: 64px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); text-decoration: none; }
    .dashboard-link:hover { border-color: var(--accent); }
    @media (prefers-reduced-motion: no-preference) and (hover: hover) {
      .dashboard-link { transition: border-color 180ms ease, translate 180ms cubic-bezier(.16, 1, .3, 1); }
      .dashboard-link:hover { translate: 0 -2px; }
    }
    /* Slightly translucent tiles let the mascot show through; the blur keeps text contrast steady */
    @supports (background: color-mix(in srgb, red 50%, transparent)) {
      .dashboard-link { background: color-mix(in srgb, var(--surface) 78%, transparent); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
    }
    .dashboard-link .helper-name { font-size: 16px; }
    .dashboard-link .helper-description { font-size: 13px; }
    .dashboard .study-support { grid-column: 1 / -1; justify-self: end; }
    .dashboard .study-support button { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 8px; padding: 9px 12px; background: #ffd140; color: #000; font-weight: 700; cursor: pointer; }
    .dashboard .study-support img { width: 20px; height: 20px; object-fit: contain; }
    @media (max-width: 650px) {
      .dashboard { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 16px 12px 12px; gap: 5px; }
      .site-header { width: calc(100% - 24px); }
      .dashboard h1 { font-size: 22px; }
      .dashboard-intro { gap: 12px; }
      .dashboard-logo { width: 56px; height: 56px; }
      .dashboard-intro p { font-size: 13px; }
      .dashboard-link .helper-description { font-size: 13px; line-height: 1.4; }
      .dashboard-link { min-height: 48px; padding: 6px; }
      .dashboard-link .helper-name { font-size: 14px; line-height: 1.3; }
      .dashboard-link .helper-icon { width: 24px; height: 24px; font-size: 15px; }
    }
  </style>
</head>
