<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta name="google-site-verification" content="cVpmfqP3jEgwMwW8zz2nX8rgiOUL8QfnO_Z_griCgf8">

  <title>日本語道具箱 · Japanese Toolkit · Nihongo Toolkit</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --surface: #fff;
      --ink: #23251f;
      --muted: #777970;
      --line: #e7e6df;
      --accent: #356653;
      --shadow: 0 12px 30px rgb(42 45 35 / 14%);
      --selected: #eaf1ec;
      --selected-ink: #254d3e;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --surface: #222923;
      --ink: #edf1eb;
      --muted: #a5afa5;
      --line: #3a443b;
      --accent: #9dceab;
      --shadow: 0 12px 30px rgb(0 0 0 / 35%);
      --selected: #2e4033;
      --selected-ink: #bee4c7;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { background: #f6f5f1; color: var(--ink); }
    :root[data-theme="dark"] body { background: #171b18; }
    button, a { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid #6caa83; outline-offset: 2px; }
    .navigation {
      position: fixed;
      z-index: 2;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
    }
    .menu-button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }
    .menu-button:hover, .helper-link:hover { border-color: var(--accent); }
    .menu-icon { display: grid; gap: 4px; }
    .menu-icon span { width: 18px; height: 2px; border-radius: 2px; background: currentColor; }
    .menu {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: min(560px, calc(100vw - 24px));
      max-height: calc(100vh - 68px);
      max-height: calc(100dvh - 68px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .menu[hidden] { display: none; }
    .menu-group { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .menu-group + .menu-group { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }
    .menu-group h2 { grid-column: 1 / -1; }
    .menu-group h2 { margin: 8px 12px 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .helper-link {
      display: block;
      width: 100%;
      padding: 6px 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .helper-link[aria-current="page"] { background: var(--selected); color: var(--selected-ink); }
    .helper-name { display: block; font-size: 14px; font-weight: 700; }
    .helper-description { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .helper-icon {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: 18px/1 "Sawarabi Mincho", serif;
      vertical-align: middle;
    }
    :root[data-theme="dark"] .helper-icon { color: #17231b; }
    .helper-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    .dashboard { max-width: 1080px; margin: 0 auto; padding: 60px 24px 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .dashboard > h1, .dashboard > p, .dashboard .menu-group h2 { grid-column: 1 / -1; }
    .dashboard h1 { margin: 0 0 8px; font-size: 30px; }
    .dashboard > p { color: var(--muted); margin: 0 0 6px; }
    .dashboard .menu-group { display: contents; }
    .dashboard .menu-group h2 { margin: 6px 0 0; font-size: 12px; }
    .dashboard-link { display: block; min-height: 64px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); text-decoration: none; }
    .dashboard-link:hover { border-color: var(--accent); }
    .dashboard-link .helper-name { font-size: 16px; }
    .dashboard-link .helper-description { font-size: 13px; }
    .dashboard .study-support { grid-column: 1 / -1; justify-self: end; }
    .dashboard .study-support button { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 8px; padding: 9px 12px; background: #ffd140; color: #000; font-weight: 700; cursor: pointer; }
    .dashboard .study-support img { width: 20px; height: 20px; object-fit: contain; }
    @media (max-width: 650px) {
      .dashboard { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 58px 12px 12px; gap: 5px; }
      .dashboard h1 { font-size: 22px; }
      .dashboard > p, .dashboard-link .helper-description { display: none; }
      .dashboard-link { min-height: 48px; padding: 6px; }
      .dashboard-link .helper-name { font-size: 12px; line-height: 1.25; }
      .dashboard-link .helper-icon { width: 22px; height: 22px; font-size: 15px; }
    }
  </style>
</head>
