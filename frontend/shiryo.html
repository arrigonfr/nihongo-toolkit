<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>NihongoToolkit</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="shell resources-shell">
    <header class="study-header">
      <a class="brand" href="./index.html"><span class="brand-mark" aria-hidden="true"><img src="/tool-icons/shiryo.webp" alt=""></span><span class="brand-name">Shiryō<span class="brand-note">NihongoToolkit</span></span></a>
      <button id="themeButton" type="button" aria-label="Change theme"></button>
    </header>
    <main>
      <section class="intro"><span class="eyebrow"><span lang="ja">資料</span> · <span>Study sheets</span></span>
        <h1>Choose a sheet. <br><span>Take it to your desk.</span></h1>
        <p>Pick a sheet, preview its pages, then download it in the format you need. Everything is generated in your browser.</p>
      </section>
      <div id="sheetPicker" class="sheet-picker" role="group" aria-label="Cheatsheet"></div>
      <div class="resources-layout">
        <section class="sheet-stage" aria-live="polite">
          <div id="sheetPreview" class="sheet-paper"></div>
        </section>
        <aside class="download-panel" aria-label="Downloads">
          <h2 id="sheetTitle"></h2>
          <p id="sheetSummary" class="download-summary"></p>
          <label class="sheet-grayscale"><input id="sheetGrayscale" type="checkbox"> Grayscale</label>
          <div id="downloadList" class="download-list"></div>
          <p id="downloadStatus" class="download-status" role="status"></p>
        </aside>
      </div>
    </main>
  </div>
  <noscript>Enable JavaScript to preview and download the cheatsheets.</noscript>
  <script type="module" src="./src/resources.js"></script>
</body>
</html>
